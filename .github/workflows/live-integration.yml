name: Live browser integration tests

on:
  workflow_dispatch:
    inputs:
      confirm_live_sites:
        description: "Run browser tests against public external sites"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-browser:
    if: ${{ inputs.confirm_live_sites }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and integration dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run opt-in browser tests
        run: >-
          python -m pytest
          -o addopts="-v --tb=short"
          tests/integration
          -m integration
